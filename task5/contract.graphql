type Query {
  """
  Аналог /clients/{id}
  """
  client(id: ID!): Client

  """
  Аналог /clients/{id}/documents. Добавлено условие, что элементы массива не должны быть null
  """
  documents(clientId: ID!): [Document!]

  """
  Аналог /clients/{id}/relatives. Добавлено условие, что элементы массива не должны быть null
  """
  relatives(clientId: ID!): [Relative!]
}

type Client {
  id: ID!
  name: String
  age: Int
  documents: [Document!]
  relatives: [Relative!]
}

type Document {
  id: ID!
  type: String
  number: String
  issueDate: String
  expiryDate: String
}

type Relative {
  id: ID!
  relationType: String
  name: String
  age: Int
}